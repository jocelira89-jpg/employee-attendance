<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Attendance</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f8;color:#17202a}
.app{max-width:480px;margin:auto;min-height:100vh;background:white}header{background:#111827;color:white;padding:21px;text-align:center}
header h1{margin:0;font-size:22px}header p{margin:6px 0 0;color:#cbd5e1;font-size:13px}main{padding:18px}
.card{border:1px solid #e5e7eb;border-radius:15px;padding:16px;margin-bottom:15px;box-shadow:0 4px 14px #00000008}
label{display:block;font-weight:bold;font-size:13px;margin:0 0 7px}input,button{width:100%;padding:13px;border-radius:10px;border:1px solid #d1d5db;font-size:15px}
button{border:0;font-weight:bold;cursor:pointer}.btn{margin-top:10px}.primary{background:#111827;color:white}.green{background:#15803d;color:white}.red{background:#b91c1c;color:white}.gray{background:#e5e7eb;color:#111827}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px}
.tab{background:#e5e7eb}.tab.active{background:#111827;color:white}.camera{width:100%;min-height:220px;background:#111827;border-radius:13px;overflow:hidden;display:flex;align-items:center;justify-content:center}
video{width:100%;display:block}#preview{width:100%;display:none;border-radius:13px}canvas{display:none}
.status{display:none;padding:11px;border-radius:9px;background:#eef2ff;font-size:13px;margin-top:10px;line-height:1.4}
.log{border:1px solid #e5e7eb;border-radius:11px;padding:12px;margin-bottom:10px}.log strong{display:block;margin-bottom:5px}
.muted,.hint{font-size:12px;color:#64748b;line-height:1.5}.hidden{display:none!important}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logout{width:auto;padding:8px 12px;background:#e5e7eb;font-size:12px}.pill{display:inline-block;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:bold;margin-top:7px;background:#dcfce7;color:#166534}
.pill.late{background:#fee2e2;color:#991b1b}
</style></head><body><div class="app">
<header><h1>Employee Attendance</h1><p>Secure employee access • Time In / Time Out</p></header><main>
<section id="loginPage"><div class="card"><h3 style="margin-top:0">Employee Login</h3>
<label for="employeeId">Employee ID</label><input id="employeeId" placeholder="Enter your Employee ID" autocomplete="username">
<label for="pin" style="margin-top:12px">PIN</label><input id="pin" type="password" inputmode="numeric" placeholder="Enter your PIN" autocomplete="current-password">
<button class="primary btn" onclick="login()">LOGIN</button><div id="loginStatus" class="status"></div>
<p class="hint">Use the Employee ID and PIN assigned in the Employees sheet.</p></div></section>
<section id="appPage" class="hidden"><div class="topline card"><div><div class="muted">Logged in as</div><strong id="employeeName"></strong>
<div class="muted" id="employeeCode"></div><div class="muted" id="employeeSchedule"></div></div><button class="logout" onclick="logout()">LOG OUT</button></div>
<div class="tabs"><button class="tab active" id="attendanceTab" onclick="showPage('attendance')">Attendance</button><button class="tab" id="logsTab" onclick="showPage('logs')">My Logs</button></div>
<section id="attendancePage"><div class="card"><div class="camera"><video id="video" autoplay playsinline></video></div>
<img id="preview" alt="Attendance photo preview"><canvas id="canvas"></canvas>
<div class="row"><button class="gray btn" onclick="startCamera()">START CAMERA</button><button class="gray btn" onclick="takePhoto()">TAKE PHOTO</button></div>
<div class="row"><button class="green btn" onclick="submitAttendance('TIME IN')">TIME IN</button><button class="red btn" onclick="submitAttendance('TIME OUT')">TIME OUT</button></div>
<div id="attendanceStatus" class="status"></div></div></section>
<section id="logsPage" class="hidden"><div class="card"><strong>My Attendance Logs</strong><p class="hint">View-only records. You cannot edit or delete attendance entries.</p><button class="gray" onclick="loadLogs()">REFRESH LOGS</button></div><div id="logs"></div></section>
</section></main></div>
<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzMj4mYBlA-gEpNtRgEkIR0yG4nlKDReCQr_QZsdq-2GC0z-xuRZ_1DSppky2DwADA7mQ/exec";
let currentEmployee=null,currentPin="",stream=null,photoData="";
function showStatus(id,msg,ok=false){const el=document.getElementById(id);el.style.display="block";el.textContent=msg;el.style.background=ok?"#dcfce7":"#eef2ff";}
async function login(){
 const id=document.getElementById("employeeId").value.trim(),pin=document.getElementById("pin").value.trim();
 if(!id||!pin){showStatus("loginStatus","Enter your Employee ID and PIN.");return;}
 showStatus("loginStatus","Checking your login...");
 try{const url=APPS_SCRIPT_URL+"?action=login&employeeId="+encodeURIComponent(id)+"&pin="+encodeURIComponent(pin);
 const res=await fetch(url);const data=await res.json();if(!data.success)throw new Error(data.message||"Invalid login.");
 currentEmployee=data.employee;currentPin=pin;document.getElementById("employeeName").textContent=currentEmployee.employeeName;
 document.getElementById("employeeCode").textContent=currentEmployee.employeeId;
 document.getElementById("employeeSchedule").textContent="Schedule: "+currentEmployee.timeInSchedule+" – "+currentEmployee.timeOutSchedule;
 document.getElementById("loginPage").classList.add("hidden");document.getElementById("appPage").classList.remove("hidden");
 document.getElementById("loginStatus").style.display="none";showPage("attendance");
 }catch(e){showStatus("loginStatus",e.message||"Login failed. Check your connection.");}}
function logout(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;currentEmployee=null;currentPin="";photoData="";
 document.getElementById("appPage").classList.add("hidden");document.getElementById("loginPage").classList.remove("hidden");
 document.getElementById("employeeId").value="";document.getElementById("pin").value="";
 document.getElementById("video").srcObject=null;document.getElementById("video").style.display="block";document.getElementById("preview").style.display="none";}
function showPage(page){document.getElementById("attendancePage").classList.toggle("hidden",page!=="attendance");
 document.getElementById("logsPage").classList.toggle("hidden",page!=="logs");document.getElementById("attendanceTab").classList.toggle("active",page==="attendance");
 document.getElementById("logsTab").classList.toggle("active",page==="logs");if(page==="logs")loadLogs();}
async function startCamera(){try{if(!navigator.mediaDevices?.getUserMedia)throw new Error("Camera requires a secure HTTPS page.");
 if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
 const v=document.getElementById("video");v.srcObject=stream;v.style.display="block";document.getElementById("preview").style.display="none";photoData="";
 showStatus("attendanceStatus","Camera is ready.",true);}catch(e){showStatus("attendanceStatus",e.message||"Allow camera permission and try again.");}}
function takePhoto(){const v=document.getElementById("video");if(!v.videoWidth){showStatus("attendanceStatus","Start the camera first.");return;}
 const c=document.getElementById("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);
 photoData=c.toDataURL("image/jpeg",0.72);const p=document.getElementById("preview");p.src=photoData;p.style.display="block";v.style.display="none";
 showStatus("attendanceStatus","Photo captured. Choose TIME IN or TIME OUT.",true);}
async function submitAttendance(type){if(!currentEmployee){showStatus("attendanceStatus","Please log in again.");return;}
 if(!photoData){showStatus("attendanceStatus","Take an attendance photo first.");return;}showStatus("attendanceStatus","Submitting "+type+"...");
 try{await fetch(APPS_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
 body:JSON.stringify({employeeId:currentEmployee.employeeId,pin:currentPin,type:type,photo:photoData})});
 showStatus("attendanceStatus",type+" submitted. Refresh My Logs to verify the record.",true);photoData="";
 document.getElementById("preview").style.display="none";document.getElementById("video").style.display="block";
 }catch(e){showStatus("attendanceStatus","Could not submit. Check your internet connection.");}}
async function loadLogs(){if(!currentEmployee)return;const box=document.getElementById("logs");box.innerHTML='<div class="card">Loading your logs...</div>';
 try{const url=APPS_SCRIPT_URL+"?action=logs&employeeId="+encodeURIComponent(currentEmployee.employeeId)+"&pin="+encodeURIComponent(currentPin);
 const res=await fetch(url);const data=await res.json();if(!data.success)throw new Error(data.message||"Could not load logs.");
 if(!data.logs.length){box.innerHTML='<div class="card">No attendance records yet.</div>';return;}
 const ordered=data.logs.slice().sort((a,b)=>getLogDate(a)-getLogDate(b));
 const hoursByLog=new Map();let pendingTimeIn=null;
 for(const log of ordered){
  if(log.type==="TIME IN"){pendingTimeIn=log;}
  else if(log.type==="TIME OUT"&&pendingTimeIn){
   const minutes=Math.max(0,Math.floor((getLogDate(log)-getLogDate(pendingTimeIn))/60000));
   const whole=Math.floor(minutes/60),remainder=minutes%60;
   const total=whole+(remainder>=30?0.5:0);
   hoursByLog.set(log,total.toFixed(1));pendingTimeIn=null;
  }
 }
 box.innerHTML=ordered.slice().reverse().map(log=>`<div class="log"><strong>${esc(log.type)}</strong><div>${esc(log.date)}</div><div>${esc(log.time)}</div>
 ${log.type==="TIME IN"&&log.status?`<span class="pill ${log.status==="LATE"?"late":""}">${esc(log.status)}</span>`:""}
 ${log.type==="TIME OUT"&&hoursByLog.has(log)?`<div style="margin-top:8px;font-weight:bold">Total Hours Worked: ${hoursByLog.get(log)} hrs</div>`:""}
 ${log.type==="TIME IN"&&!hoursByLog.size?"":""}
 <div class="muted">${esc(log.timestamp)}</div>${log.photo?`<div style="margin-top:8px"><a href="${escAttr(log.photo)}" target="_blank" rel="noopener">View attendance photo</a></div>`:""}</div>`).join("");
 }catch(e){box.innerHTML='<div class="card">Could not load logs. Check the Apps Script deployment.</div>';}}
function getLogDate(log){
 const stamp=log.timestamp?new Date(log.timestamp):new Date(NaN);
 if(!Number.isNaN(stamp.getTime()))return stamp;
 return new Date(String(log.date||"")+" "+String(log.time||""));
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function escAttr(s){return esc(s);}
</script></body></html>
